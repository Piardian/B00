name: Backtest Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  read-only-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run audit unit tests
        run: python -m unittest discover -s tests -v
      - name: Audit persisted backtest summaries
        run: python scripts/audit_backtest_results.py
